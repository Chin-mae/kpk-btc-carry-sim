[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kpk-carry-sim"
version = "0.1.0"
description = "Gauntlet-style Monte Carlo risk engine for KPK BTC Carry Fund at institutional scale ($50M)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Chinmay Gupta" }
]
dependencies = [
    "numpy>=2.0.0",
    "pandas>=3.0.0",
    "scipy>=1.18.0",
    "pyarrow>=26.0.0",
    "matplotlib>=3.11.0",
    "pyyaml>=6.0.0",
    "requests>=2.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
